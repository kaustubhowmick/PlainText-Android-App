name: Emulator stress run

# About 20 minutes per run, so it runs on demand: Actions > Emulator stress run > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: Open stress-test files on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Generate stress-test files
        run: python3 stress-test-files/generate.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash .github/emulator/stress-smoke.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-stress-results
          path: emulator-out/
          if-no-files-found: ignore
