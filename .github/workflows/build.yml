name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, debug APK, release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_USER_HOME: /home/runner/.android-user
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Without release-signing secrets the release APK is signed with the debug
      # key (see DECISIONS.md). Caching that key keeps it the same across runs,
      # so a newer CI build installs over an older one without uninstalling.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_USER_HOME }}/debug.keystore
          key: plaintext-debug-keystore-v1

      - name: Create debug signing key if missing
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Release APK size
        run: |
          ls -l app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          scripts/check-apk-size.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PlainText-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PlainText-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  stress-test-files:
    name: Stress-test files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Regenerates the git-ignored large files; the checksum check also proves
      # the committed small files and checksums.txt match the script.
      - name: Generate and verify
        run: |
          python3 stress-test-files/generate.py
          git diff --exit-code -- stress-test-files
          cd stress-test-files && sha256sum -c checksums.txt
      - name: Upload stress-test files
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-files
          path: stress-test-files/
          if-no-files-found: error
